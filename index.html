/* ============================== МОДЕЛЬ БЛОКІВ ==============================

   - Text "ID": Code-режим із реальною помилкою виконання (typo в назві

const INITIAL_BLOCKS = {
  id: "card", type: "Container", name: "Card",
  children: [
    { id: "text-header", type: "Text", name: "Header", children: null },
    {

  headers: [{ key: "Authorization", value: "Bearer {{secrets.API_TOKEN}}" }],
  body: "", auth: "inherit", authValue: "", runBehavior: "onLoad",
  lastStatus: 200, lastDurationMs: 142, lastSizeKb: 3.1, hasOutputSchema: true
};
const INITIAL_TRANSFORMER = {
  id: "filterINC", name: "filterINC", sourceId: "getTickets",
  code: "function transform({ apiData }) {\n  return apiData.tickets.filter(t => t.source_reference_number.startsWith('INC'));\n}"
};

const CONTAINER_TYPES = ["Container", "Collection", "Tabs"];
const TYPE_ICON = {
  Container: "box", Text: "type", Image: "image", Button: "button", Tabs: "tabs",
  Collection: "layers", Filter: "filter", Chart: "barChart", Progress: "progress",
  Divider: "divider", Badge: "badgeIcon"
};
const INSERT_ITEMS = ["Text", "Image", "Button", "Container", "Tabs", "Collection", "Filter", "Chart", "Progress", "Divider"];

let __idCounter = 100;

function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

function createBlock(type) {
  const node = { id: genId(type.toLowerCase()), type, name: type, children: null };
  if (CONTAINER_TYPES.includes(type)) node.children = [];
  return node;
}
function reassignIds(node) {
  node.id = genId(node.type.toLowerCase());
  if (node.children) node.children.forEach(reassignIds);
}
function findNodeAndParent(root, id, parent) {
  if (root.id === id) return { node: root, parent: parent || null };
  if (root.children) {
    for (let i = 0; i < root.children.length; i++) {
      const res = findNodeAndParent(root.children[i], id, root);
      if (res) return res;
    }
  }
  return null;
}
function getPathTo(root, id, trail) {
  const next = (trail || []).concat([root]);
  if (root.id === id) return next;
  if (root.children) {
    for (let i = 0; i < root.children.length; i++) {
      const res = getPathTo(root.children[i], id, next);
      if (res) return res;
    }
  }
  return null;
}
function flattenTree(node, depth, collapsedSet, out, scope) {
  out.push({ node, depth, scope: scope || "apiData" });
  const childScope = node.type === "Collection" ? "item" : (scope || "apiData");
  if (node.children && !collapsedSet.has(node.id)) {
    node.children.forEach(c => flattenTree(c, depth + 1, collapsedSet, out, childScope));
  }
  return out;
}
// Обчислює scope блока (apiData / item), не проходячи по всьому дереву вручну —
// той самий "усередині Collection = item" принцип, що й breadcrumb.
function getScopeForId(blocks, id) {
  const path = getPathTo(blocks, id, []);
  if (!path) return "apiData";
  return path.slice(0, -1).some(n => n.type === "Collection") ? "item" : "apiData";
}
// Фільтрує тікети, чий source_reference_number починається з "INC" — це
// той самий трансформер "filterINC", який редагується у фазі 3.
function applyTransform() {
  return SAMPLE_PAYLOAD.tickets
    .filter(t => t.source_reference_number.startsWith("INC"))
    .map((r, i) => Object.assign({}, r, { __rowIndex: i }));
}

/* ============================== СХЕМА ДАНИХ + ДВИЖОК ПРАВИЛ ВИДИМОСТІ ==============================
   Легка, захардкоджена під SAMPLE_PAYLOAD "схема" — достатньо для валідації
   шляхів (item.status, apiData.profile.name, …), підказок типу поля для
   перевірки на невідповідність типів і для field picker. Це навмисно НЕ
   повноцінний JSON Schema рушій — для прототипу з фіксованим мок-payload
   цього достатньо. */
const ITEM_SCHEMA = { id: "string", summary: "string", status: "string", priority: "number", sla_percent: "number", assignee: "string", source_reference_number: "string" };
const APIDATA_SCHEMA = {
  profile: { name: "string", email: "string", license_type: "string", is_admin: "boolean", department: "string" },
  tickets: "array",
  meta: { total: "number", fetched_at: "string" }
};
// Представницький запис для live-оцінки правил у Properties-панелі —
// перший рядок колекції після трансформера (INC-4021, status: open).
const SAMPLE_ITEM = applyTransform()[0];

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const d = [];
  for (let i = 0; i <= m; i++) { d.push([i]); }
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] : 1 + Math.min(d[i - 1][j - 1], d[i - 1][j], d[i][j - 1]);
    }
  }
  return d[m][n];
}
function closestKey(key, candidates) {
  let best = null, bestDist = Infinity;
  candidates.forEach(c => { const dist = levenshtein(key, c); if (dist < bestDist) { bestDist = dist; best = c; } });
  return bestDist <= 2 ? best : null;

// Перевіряє шлях типу "item.status" чи "apiData.profile.name" проти схеми.
// null = валідний шлях; інакше { message, suggestion, fixPath, path }.
function checkFieldPath(path, scope) {
  if (!path) return null;
  const parts = path.split(".");
  const rootName = parts[0];
  if (rootName === "item") {
    if (scope !== "item") {
      return { message: `"item" is not available here — this block is outside a Collection (scope: ${scope}).`, suggestion: null, fixPath: null, path };
    }
    const key = parts[1];
    if (!key) return null;
    if (!(key in ITEM_SCHEMA)) {
      const suggestion = closestKey(key, Object.keys(ITEM_SCHEMA));
      return {
        message: `No field "${key}" on item.` + (suggestion ? ` Did you mean "${suggestion}"?` : ""),
        suggestion, fixPath: suggestion ? "item." + suggestion : null, path
      };
    }
    return null;
  }
  if (rootName === "apiData") {
    let node = APIDATA_SCHEMA;
    for (let i = 1; i < parts.length; i++) {
      const key = parts[i];
      if (typeof node !== "object" || node === null || !(key in node)) {
        const candidates = (typeof node === "object" && node) ? Object.keys(node) : [];
        const suggestion = closestKey(key, candidates);
        return {
          message: `No field "${key}" on ${parts.slice(0, i).join(".")}.` + (suggestion ? ` Did you mean "${suggestion}"?` : ""),
          suggestion, fixPath: suggestion ? parts.slice(0, i).concat([suggestion]).join(".") : null, path
        };
      }
      node = node[key];
    }
    return null;
  }

}
function fieldType(path, scope) {
  if (!path || checkFieldPath(path, scope)) return null;
  const parts = path.split(".");
  if (parts[0] === "item") return ITEM_SCHEMA[parts[1]] || null;
  let node = APIDATA_SCHEMA;
  for (let i = 1; i < parts.length; i++) node = node[parts[i]];
  return typeof node === "string" ? node : "object";
}

  let cur = parts[0] === "item" ? ctx.item : ctx.apiData;
  for (let i = 1; i < parts.length; i++) { if (cur == null) return undefined; cur = cur[parts[i]]; }
  return cur;
}
function compareValues(left, operator, rawValue, type) {
  if (operator === "is empty") return left === null || left === undefined || left === "";
  if (operator === "is not empty") return !(left === null || left === undefined || left === "");
  let right = rawValue;
  if (type === "number") right = Number(rawValue);
  if (type === "boolean") right = rawValue === "true";
  switch (operator) {
    case "is": return left === right || (type === "number" && Number(left) === Number(right));
    case "is not": return !(left === right);
    case "contains": return String(left == null ? "" : left).toLowerCase().includes(String(rawValue).toLowerCase());
    case ">": return Number(left) > Number(right);
    case "<": return Number(left) < Number(right);

  }
}
const OPERATORS_BY_TYPE = {
  string: ["is", "is not", "contains", "is empty", "is not empty"],
  number: ["is", "is not", ">", "<", "is empty", "is not empty"],
  boolean: ["is", "is not"],
  object: ["is empty", "is not empty"],
  array: ["is empty", "is not empty"]
};
function emptyCondition() { return { field: "", operator: "is", value: "" }; }
function defaultVisibility() { return { mode: "toggle", toggleValue: "visible", conditions: [emptyCondition()], match: "all", code: "" }; }
// Перевіряє одну структуровану умову на порівняння різних типів (число ↔ рядок).
function analyzeCondition(cond, scope) {
  const warnings = [];
  if (!cond.field || cond.operator === "is empty" || cond.operator === "is not empty") return { warnings };
  const ft = fieldType(cond.field, scope);
  if (ft === "number" && cond.value.trim() !== "" && isNaN(Number(cond.value))) {
    warnings.push("Comparing string to number — this may never match.");
  }

// Скан однорядкового JS-виразу (Code-режим) на прості порівняння "path OP literal",
// щоб дати ті самі два статичні попередження (typo / type mismatch) без повного парсера.
const CMP_RE = /([a-zA-Z_$][\w.$]*)\s*(===|!==|==|!=|>=|<=|>|<)\s*('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|-?\d+(?:\.\d+)?\b|true\b|false\b|null\b)/g;

  // коді — інакше отримали б безглузде "item.priority === NaN" і статичний
  // аналізатор коду більше не побачив би невідповідність типів.
  if (type === "number") return isNaN(Number(value)) ? JSON.stringify(value) : String(Number(value));

    if (c.operator === "contains") return `String(${c.field}).includes(${JSON.stringify(c.value)})`;
    const op = c.operator === "is" ? "===" : c.operator === "is not" ? "!==" : c.operator;

function makeInteractionsDraft(node) {
  return {
    visibility: node.visibility || defaultVisibility(),
    emptyBehavior: node.emptyBehavior || { mode: "hide", fallbackText: "" }
  };
}
function InteractionsTab({ node, scope, onCommit }) {
  const [draft, setDraft] = useState(() => makeInteractionsDraft(node));
  const [confirmState, setConfirmState] = useState(null);
  const [expandOpen, setExpandOpen] = useState(false);
  React.useEffect(() => { setDraft(makeInteractionsDraft(node)); setConfirmState(null); setExpandOpen(false); }, [node.id]);

  function setLocal(patch) { setDraft(d => Object.assign({}, d, patch)); }
  function commit(patch) { const next = Object.assign({}, draft, patch); setDraft(next); onCommit(next); }

  const vis = draft.visibility;
  const evalResult = evaluateVisibilityConfig(vis, scope);

  function handleModeSwitch(newMode) {
    if (newMode === vis.mode) return;
    if (vis.mode === "code" && newMode === "rule" && vis.code && vis.code.trim()) {
      setConfirmState({
        message: 'This code can’t be shown as a visual rule. Switching will discard it.',
        onConfirm: () => { commit({ visibility: Object.assign({}, vis, { mode: "rule", code: "", conditions: [emptyCondition()] }) }); setConfirmState(null); }
      });
      return;
    }
    if (vis.mode === "rule" && newMode === "code") {
      commit({ visibility: Object.assign({}, vis, { mode: "code", code: conditionsToCode(vis.conditions, vis.match, scope) }) });
      return;
    }
    commit({ visibility: Object.assign({}, vis, { mode: newMode }) });
  }

  return (
    <div className="space-y-5">
      <div>
        <div className="text-[12px] font-semibold text-slate-700 mb-1.5">Hide this block</div>
        <VisibilitySegmented mode={vis.mode} onChange={handleModeSwitch}/>
        <div className="mt-1.5 text-[10px] text-slate-400">
          {vis.mode === "toggle" && "Simple on/off switch — no data involved."}
          {vis.mode === "rule" && `Block is visible when ${vis.match === "any" ? "any" : "all"} conditions below are true. Fields resolve against scope: ${scope}.`}
          {vis.mode === "code" && `Raw JS expression, evaluated as a boolean. Truthy = visible. Scope: ${scope}.`}
        </div>
        <div className="mt-2">
          {vis.mode === "toggle" && <ToggleModeBlock vis={vis} onChange={v => commit({ visibility: v })}/>}
          {vis.mode === "rule" && <RuleBuilder vis={vis} scope={scope} onChange={v => commit({ visibility: v })}/>}
          {vis.mode === "code" && (
            <CodeModeBlock vis={vis} scope={scope}
              onLocalChange={v => setLocal({ visibility: v })}
              onCommitChange={v => commit({ visibility: v })}
              onExpand={() => setExpandOpen(true)}/>
          )}
        </div>
        <LiveResultRow visible={evalResult.visible} runtimeError={evalResult.runtimeError}/>
      </div>

      <div className="border-t border-slate-200 pt-4">
        <EmptyBehaviorField value={draft.emptyBehavior}
          onLocalChange={v => setLocal({ emptyBehavior: v })}
          onCommitChange={v => commit({ emptyBehavior: v })}/>
      </div>

      {confirmState && <ConfirmDialog message={confirmState.message} onConfirm={confirmState.onConfirm} onCancel={() => setConfirmState(null)}/>}
      {expandOpen && (
        <ExpandedFieldModal title='Edit "Hide this block" — code' hint={`Scope: ${scope} — return a boolean expression.`}
          initialValue={vis.code || ""} scope={scope} onClose={() => setExpandOpen(false)}
          onSave={code => { commit({ visibility: Object.assign({}, vis, { code }) }); setExpandOpen(false); }}/>
      )}
    </div>
  );
}

   ВЗАГАЛІ (а не притлумлюються) — це і є "правила видимості реально
   застосовані", про які просить ТЗ. */
function PreviewBlock({ node, dataItem, scope }) {
  const vis = evaluateVisibilityConfig(node.visibility, scope);
  if (!vis.visible) return null;
  if (node.type === "Collection") {
    const records = applyTransform();
    return (
      <div className="flex flex-col gap-2 p-2">
        {records.map(rec => (
          <Fragment key={rec.id}>
            {(node.children || []).map(child => <PreviewBlock key={child.id + "-" + rec.id} node={child} dataItem={rec} scope="item"/>)}
          </Fragment>
        ))}
      </div>
    );
  }
  if (CONTAINER_TYPES.includes(node.type)) {
    const isRow = node.name === "Row";
    return (
      <div className={isRow ? "flex items-center gap-3 p-2" : "flex flex-col gap-2 p-2"}>
        {(node.children || []).map(child => <PreviewBlock key={child.id} node={child} dataItem={dataItem} scope={scope}/>)}
      </div>
    );
  }
  return <div className="p-1"><LeafContent node={node} dataItem={dataItem}/></div>;
}

function LayerRow(props) {

  return (
    <div
      draggable={!isRoot}
      onDragStart={e => onDragStart(e, node.id)}
      onDragOver={e => { e.preventDefault(); onDragOver(node.id); }}
      onDrop={e => { e.preventDefault(); onDrop(node.id); }}
      onClick={onSelect}
      style={{ paddingLeft: 6 + depth * 14 }}
      className={`flex items-center gap-1 py-1 pr-2 cursor-pointer text-[12px] border-t-2
        ${isSelected ? "bg-[var(--accent)]/10 text-[var(--accent)]" : "hover:bg-slate-100 text-slate-700"}

      <span onClick={e => { e.stopPropagation(); if (hasChildren) onToggleCollapse(); }}
            className="w-3.5 h-3.5 flex items-center justify-center text-slate-400 shrink-0">
        {hasChildren && <Icon name={isCollapsed ? "chevronRight" : "chevronDown"} size={12}/>}

      <span className="truncate flex-1">{node.name}</span>
      <span className="flex items-center gap-1 shrink-0">
        {node.transformerId && (
          <span className="relative group/tip text-[9px] font-mono px-1 rounded bg-violet-50 text-violet-600 border border-violet-200">
            fx<Tooltip>Transformer "{node.transformerId}" — filters getTickets by source_reference_number</Tooltip>
          </span>
        )}
        {audit.hasVisibility && (
          <span className="relative group/tip text-slate-400">
            <Icon name="eye" size={12}/>
            <Tooltip>Visibility rule: {audit.description}</Tooltip>
          </span>
        )}
        {audit.warningMessage && (
          <span className="relative group/tip text-amber-500">
            <Icon name="triangleAlert" size={12}/>
            <Tooltip>{audit.warningMessage}</Tooltip>
          </span>
        )}
        {audit.errorMessage && (
          <span className="relative group/tip text-red-500">
            <Icon name="triangleAlert" size={12}/>

}
function LayersTree({ blocks, selectedId, setSelectedId, collapsed, setCollapsed, search, drag, setDrag, onReorder }) {
  const flat = flattenTree(blocks, 0, collapsed, [], "apiData");
  const q = search.trim().toLowerCase();
  const filtered = q ? flat.filter(f => f.node.name.toLowerCase().includes(q) || f.node.type.toLowerCase().includes(q)) : flat;
  return (
    <div className="overflow-y-auto flex-1">
      {filtered.map(({ node, depth, scope }) => (
        <LayerRow key={node.id} node={node} depth={q ? 0 : depth} scope={scope}
          isSelected={selectedId === node.id}
          hasChildren={!!(node.children && node.children.length > 0)}
          isCollapsed={collapsed.has(node.id)}
          isRoot={node.id === "card"}
          isDropTarget={drag.overId === node.id}
          onToggleCollapse={() => setCollapsed(prev => {
            const n = new Set(prev);
            n.has(node.id) ? n.delete(node.id) : n.add(node.id);
            return n;
          })}
          onSelect={() => setSelectedId(node.id)}
          onDragStart={(e, id) => setDrag({ id, overId: null })}
          onDragOver={id => setDrag(d => ({ ...d, overId: id }))}
          onDrop={id => { onReorder(drag.id, id); setDrag({ id: null, overId: null }); }}
        />
      ))}
    </div>
  );
}

function findConsumerLabel(root, transformerId) {
  let found = null;
  (function walk(n) {
    if (found || !n) return;
    if (n.transformerId === transformerId) { found = `${n.type} "${n.name}"`; return; }
    (n.children || []).forEach(walk);
  })(root);
  return found;
}

function summarizeType(v) {
  if (v === null || v === undefined) return "null";
  if (Array.isArray(v)) return `array[${v.length}]`;
  return typeof v;
}
function JsonSummary({ value }) {

  return (

      {Object.keys(value).map(k => (

          <span className="font-mono text-slate-700">{k}</span>

}

    return { result: null, error: e.message };

}

/* ============================== КАНВАС ============================== */
function LeafContent({ node, dataItem }) {
  if (node.type === "Text") {
    if (node.name === "Header") return <div className="text-[15px] font-semibold text-slate-800">My tickets</div>;
    if (node.name === "Empty state") return <div className="text-[12px] text-slate-400 italic py-1">No tickets to show</div>;
    if (node.name === "ID" && dataItem) return <div className="text-[12px] font-mono text-slate-600">{dataItem.id}</div>;
    return <div className="text-[13px] text-slate-700">{node.name}</div>;
  }
  if (node.type === "Badge") {
    const status = dataItem ? dataItem.status : "open";
    const styles = {
      open: "bg-[var(--accent)]/10 text-[var(--accent)] border-[var(--accent)]/30",
      closed: "bg-slate-100 text-slate-500 border-slate-200",
      pending: "bg-amber-50 text-amber-600 border-amber-200"
    };
    return <span className={`text-[11px] px-2 py-0.5 rounded-full border ${styles[status] || styles.open}`}>{status}</span>;
  }
  if (node.type === "Progress") {
    const skeleton = dataItem && dataItem.__rowIndex === 1;
    if (skeleton) return <div className="h-2 w-16 rounded skeleton-shimmer"/>;
    const pct = dataItem ? dataItem.sla_percent : 0;
    return (
      <div className="flex items-center gap-1.5 w-16">
        <div className="flex-1 h-1.5 bg-slate-100 rounded overflow-hidden">
          <div className="h-full bg-[var(--accent)]" style={{ width: pct + "%" }}/>
        </div>
        <span className="text-[10px] text-slate-400 tabular-nums">{pct}%</span>
      </div>
    );
  }
  return <div className="text-[12px] text-slate-400 border border-dashed border-slate-300 rounded px-2 py-1">{node.type} · {node.name}</div>;
}
function BlockWrapper({ node, selectedId, hoveredId, setHoveredId, onSelect, onDuplicate, onDelete, onWrap, children, dataItem }) {
  const isSelected = selectedId === node.id;
  const isHovered = hoveredId === node.id;
  const isRoot = node.id === "card";
  // У Collection той самий блок-шаблон рендериться для кожного запису:
  // рамку виділення показуємо на всіх екземплярах, а міні-тулбар — лише
  // на першому, щоб не дублювати кнопки дій.
  const showToolbar = !dataItem || dataItem.__rowIndex === 0;
  // Per-block Appearance override (Override-кнопка на Appearance-табі) скопійовує
  // --accent тільки в межах цього блока й нащадків — see AppearanceTab.
  const accentOverride = node.appearanceOverrides && node.appearanceOverrides.accentColor;
  return (
    <div
      style={accentOverride ? { "--accent": accentOverride } : undefined}
      onMouseEnter={e => { e.stopPropagation(); setHoveredId(node.id); }}
      onMouseLeave={e => { e.stopPropagation(); setHoveredId(prev => (prev === node.id ? null : prev)); }}
      onClick={e => { e.stopPropagation(); onSelect(node.id); }}
      className={`relative ${isSelected ? "outline outline-2 outline-[var(--accent)] outline-offset-[-1px]" : isHovered ? "outline outline-1 outline-slate-300 outline-offset-[-1px]" : ""}`}>
      {isSelected && !isRoot && showToolbar && (
        <div className="absolute -top-7 left-0 flex items-center gap-0.5 bg-slate-900 text-white rounded-md px-1 py-1 shadow-sm z-20">
          <button title="Drag" className="p-1 hover:bg-white/10 rounded cursor-grab"><Icon name="grip" size={13}/></button>
          <button title="Duplicate" onClick={e => { e.stopPropagation(); onDuplicate(node.id); }} className="p-1 hover:bg-white/10 rounded"><Icon name="copy" size={13}/></button>
          <button title="Wrap in container" onClick={e => { e.stopPropagation(); onWrap(node.id); }} className="p-1 hover:bg-white/10 rounded"><Icon name="box" size={13}/></button>
          <button title="Delete" onClick={e => { e.stopPropagation(); onDelete(node.id); }} className="p-1 hover:bg-white/10 rounded text-red-300"><Icon name="trash" size={13}/></button>
        </div>
      )}
      {children}
    </div>
  );
}
function CanvasBlock(props) {
  const { node, selectedId, hoveredId, setHoveredId, onSelect, onDuplicate, onDelete, onWrap, dataItem, scope } = props;
  const wrapperProps = { node, selectedId, hoveredId, setHoveredId, onSelect, onDuplicate, onDelete, onWrap, dataItem };
  // Правила видимості на канвасі-редакторі не приховують блок повністю (щоб
  // його завжди можна було виділити й відредагувати) — лише притлумлюють,
  // як preview-натяк. Повне застосування правил — у Preview-режимі (фаза 4).
  const hidden = node.id !== "card" && !evaluateVisibilityConfig(node.visibility, scope).visible;

  if (node.type === "Collection") {
    const records = applyTransform();
    return (
      <BlockWrapper {...wrapperProps}>
        <div className={`flex flex-col gap-2 p-2 ${hidden ? "opacity-40" : ""}`}>
          {records.map(rec => (
            <div key={rec.id} className="pl-3 border-l border-dashed border-slate-300">
              {(node.children || []).map(child => (
                <CanvasBlock key={child.id + "-" + rec.id} {...props} node={child} dataItem={rec} scope="item"/>
              ))}
            </div>
          ))}
        </div>
      </BlockWrapper>
    );
  }
  if (CONTAINER_TYPES.includes(node.type)) {
    const isRow = node.name === "Row";
    return (
      <BlockWrapper {...wrapperProps}>
        <div className={`${isRow ? "flex items-center gap-3 p-2" : "flex flex-col gap-2 p-2"} ${hidden ? "opacity-40" : ""}`}>
          {(node.children || []).map(child => (
            <div key={child.id} className="pl-3 border-l border-dashed border-slate-300">
              <CanvasBlock {...props} node={child}/>
            </div>
          ))}
        </div>
      </BlockWrapper>
    );
  }
  return (
    <BlockWrapper {...wrapperProps}>
      <div className={`p-1 ${hidden ? "opacity-40" : ""}`}>
        <LeafContent node={node} dataItem={dataItem}/>
      </div>
    </BlockWrapper>
  );
}
function Breadcrumb({ blocks, selectedId }) {
  const path = selectedId ? getPathTo(blocks, selectedId, []) : null;
  if (!path) {
    return <div className="text-[11px] text-slate-400 px-3 py-2 border-t border-slate-200 bg-white">Select a block to see its path</div>;
  }
  // OPEN QUESTION / design decision: усередині Collection ми навмисно
  // використовуємо окремий префікс "item" (а не "apiData"), щоб рівні
  // даних відрізнялись явно — це головний захист від "посилаюсь на дані
  // не того рівня".
  const isItemScope = path.slice(0, -1).some(n => n.type === "Collection");
  return (
    <div className="flex items-center justify-between px-3 py-2 border-t border-slate-200 bg-white text-[11px]">
      <div className="flex items-center gap-1 text-slate-500 overflow-x-auto">
        {path.map((n, i) => (
          <Fragment key={n.id}>
            {i > 0 && <span className="text-slate-300">›</span>}

          </Fragment>

      <span className={`ml-3 shrink-0 px-2 py-0.5 rounded-full border text-[10px] font-medium ${isItemScope ? "bg-violet-50 text-violet-600 border-violet-200" : "bg-slate-50 text-slate-500 border-slate-200"}`}>
        scope: {isItemScope ? "item" : "apiData"}
      </span>
    </div>
  );
}

/* ============================== ПРАВА ПАНЕЛЬ: ВЛАСТИВОСТІ ============================== */
function PropertiesPanel({ selectedNode, scope, tab, setTab, tileTheme, setTileTheme, onCommitBlock }) {

/* ============================== ГОЛОВНИЙ ДОДАТОК ============================== */
function App() {
  const [history, setHistory] = useState({ past: [], present: INITIAL_BLOCKS, future: [] });
  const blocks = history.present;
  const [selectedId, setSelectedId] = useState("badge-status");
  const [hoveredId, setHoveredId] = useState(null);
  const [collapsed, setCollapsed] = useState(new Set());
  const [structureTab, setStructureTab] = useState("layers");
  const [search, setSearch] = useState("");
  const [drag, setDrag] = useState({ id: null, overId: null });

  const [leftCollapsed, setLeftCollapsed] = useState(false);
  const [rightCollapsed, setRightCollapsed] = useState(false);
  const [propsTab, setPropsTab] = useState("Interactions");
  const [tileTheme, setTileTheme] = useState({ accentColor: "#4f46e5", density: "comfortable" });

  const [dataSources, setDataSources] = useState([INITIAL_API_ACTION]);
  const [transformers, setTransformers] = useState([INITIAL_TRANSFORMER]);
  const [apiActionModal, setApiActionModal] = useState(null);
  const [transformerModalId, setTransformerModalId] = useState(null);
  const [sampleViewerOpen, setSampleViewerOpen] = useState(false);

  const [tileName, setTileName] = useState("My tickets");
  const [renaming, setRenaming] = useState(false);
  const [tileNameInput, setTileNameInput] = useState(tileName);

  const [saveStatus, setSaveStatus] = useState("saved");
  const [mode, setMode] = useState("desktop");
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [historyOpen, setHistoryOpen] = useState(false);
  const [tileSettings, setTileSettings] = useState({ description: "", permissions: "everyone", refreshInterval: "manual" });
  const [checkpoints, setCheckpoints] = useState(VERSION_CHECKPOINTS);
  const [checkpointPreview, setCheckpointPreview] = useState(null);
  const [bottomPanel, setBottomPanel] = useState({ open: false, tab: "preview" });

  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  function showToast(msg) {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2200);
  }

  function commitBlocks(updater) {
    setHistory(h => {
      const next = typeof updater === "function" ? updater(h.present) : updater;
      if (next === h.present) return h;
      return { past: h.past.concat([h.present]), present: next, future: [] };
    });
  }
  function undo() {
    setHistory(h => {
      if (!h.past.length) return h;
      const previous = h.past[h.past.length - 1];
      return { past: h.past.slice(0, -1), present: previous, future: [h.present].concat(h.future) };
    });
  }
  function redo() {
    setHistory(h => {
      if (!h.future.length) return h;
      const next = h.future[0];
      return { past: h.past.concat([h.present]), present: next, future: h.future.slice(1) };
    });
  }

  function handleInsert(type) {
    const newNode = createBlock(type);
    commitBlocks(prev => {
      const clone = deepClone(prev);
      const target = selectedId ? findNodeAndParent(clone, selectedId) : null;
      let container;
      if (target && CONTAINER_TYPES.includes(target.node.type)) container = target.node;
      else if (target && target.parent) container = target.parent;
      else container = clone;
      container.children = container.children || [];
      container.children.push(newNode);
      return clone;
    });
    setSelectedId(newNode.id);
  }
  function duplicateBlock(id) {
    commitBlocks(prev => {
      const clone = deepClone(prev);
      const info = findNodeAndParent(clone, id);
      if (!info || !info.parent) { showToast("Can't duplicate the root block"); return prev; }
      const copy = deepClone(info.node);
      reassignIds(copy);
      const idx = info.parent.children.indexOf(info.node);
      info.parent.children.splice(idx + 1, 0, copy);
      return clone;
    });
  }
  function deleteBlock(id) {
    commitBlocks(prev => {
      const clone = deepClone(prev);
      const info = findNodeAndParent(clone, id);
      if (!info || !info.parent) { showToast("Can't delete the root block"); return prev; }
      info.parent.children.splice(info.parent.children.indexOf(info.node), 1);
      return clone;
    });
    setSelectedId(sel => (sel === id ? null : sel));
  }
  function wrapBlock(id) {
    commitBlocks(prev => {
      const clone = deepClone(prev);
      const info = findNodeAndParent(clone, id);
      if (!info || !info.parent) { showToast("Can't wrap the root block"); return prev; }
      const wrapper = { id: genId("container"), type: "Container", name: "Group", children: [info.node] };
      info.parent.children.splice(info.parent.children.indexOf(info.node), 1, wrapper);
      return clone;
    });
  }
  function updateBlock(id, patch) {
    commitBlocks(prev => {
      const clone = deepClone(prev);
      const info = findNodeAndParent(clone, id);
      if (!info) return prev;
      const p = typeof patch === "function" ? patch(info.node) : patch;
      Object.assign(info.node, p);
      return clone;
    });
  }
  function reorderBlock(dragId, targetId) {
    if (!dragId || !targetId || dragId === targetId) return;
    commitBlocks(prev => {
      const clone = deepClone(prev);
      const dragInfo = findNodeAndParent(clone, dragId);
      const targetInfo = findNodeAndParent(clone, targetId);
      if (!dragInfo || !targetInfo || !dragInfo.parent || !targetInfo.parent) return prev;
      dragInfo.parent.children.splice(dragInfo.parent.children.indexOf(dragInfo.node), 1);
      const newIdx = targetInfo.parent.children.indexOf(targetInfo.node);
      targetInfo.parent.children.splice(newIdx, 0, dragInfo.node);
      return clone;
    });
  }

  function openApiAction(id) {
    const src = dataSources.find(s => s.id === id);
    if (src) setApiActionModal({ source: src, isNew: false });
  }
  function saveApiAction(draft) {
    setDataSources(prev => prev.some(s => s.id === draft.id) ? prev.map(s => (s.id === draft.id ? draft : s)) : prev.concat([draft]));
    setApiActionModal(null);
  }
  function saveTransformer(id, code) {
    setTransformers(prev => prev.map(t => (t.id === id ? Object.assign({}, t, { code }) : t)));
    setTransformerModalId(null);
  }
  function restoreCheckpoint(cp) {
    commitBlocks(() => deepClone(cp.blocks));
    setSelectedId(null);
    setHistoryOpen(false);
    showToast(`Restored to "${cp.label}"`);
  }
  function saveCheckpointNow() {
    const time = "Today " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    setCheckpoints(cps => [{ id: genId("cp"), label: "Manual save", author: "Olena Kovalenko", time, blocks: deepClone(blocks) }].concat(cps));
    showToast("Checkpoint saved");
  }

  function commitTileName() {
    setTileName(tileNameInput.trim() || tileName);
    setRenaming(false);
  }
  function cycleSaveStatus() {
    setSaveStatus(s => (s === "saved" ? "saving" : s === "saving" ? "error" : "saved"));
  }
  function retrySave() {
    setSaveStatus("saving");
    setTimeout(() => setSaveStatus("saved"), 900);
  }

  const selInfo = selectedId ? findNodeAndParent(blocks, selectedId) : null;
  const selectedNode = selInfo ? selInfo.node : null;
  const selectedScope = selectedId ? getScopeForId(blocks, selectedId) : null;

  return (
    <div className="h-screen w-screen flex flex-col overflow-hidden bg-slate-100 text-[13px]"
         style={{ "--accent": tileTheme.accentColor }}>
      <TopBar
        canUndo={history.past.length > 0} canRedo={history.future.length > 0}
        onUndo={undo} onRedo={redo}
        tileName={tileName} renaming={renaming} setRenaming={r => { setTileNameInput(tileName); setRenaming(r); }}
        tileNameInput={tileNameInput} setTileNameInput={setTileNameInput} commitTileName={commitTileName}
        saveStatus={saveStatus} onCycleSave={cycleSaveStatus} onRetrySave={retrySave}
        mode={mode} setMode={setMode}
        onOpenSettings={() => setSettingsOpen(true)} onOpenHistory={() => setHistoryOpen(true)}
        onPublish={() => showToast("Publish — буде доступно у фазі 4")}
      />

      <div className="flex-1 flex overflow-hidden min-h-0">
        <SidePanel side="left" collapsed={leftCollapsed} onToggle={() => setLeftCollapsed(v => !v)} width={260}>
          <div className="flex-1 flex flex-col overflow-hidden" style={{ minHeight: 0 }}>
            <div className="flex border-b border-slate-200 text-[12px]">
              <button onClick={() => setStructureTab("layers")}
                      className={`flex-1 px-2 py-2 border-b-2 -mb-px ${structureTab === "layers" ? "border-[var(--accent)] text-[var(--accent)] font-medium" : "border-transparent text-slate-500"}`}>
                Layers
              </button>
              <button onClick={() => setStructureTab("insert")}
                      className={`flex-1 px-2 py-2 border-b-2 -mb-px ${structureTab === "insert" ? "border-[var(--accent)] text-[var(--accent)] font-medium" : "border-transparent text-slate-500"}`}>
                Insert
              </button>
            </div>
            {structureTab === "layers" ? (
              <>
                <div className="p-2 border-b border-slate-200">
                  <div className="flex items-center gap-1.5 bg-white border border-slate-200 rounded px-2 py-1">
                    <Icon name="search" size={13} className="text-slate-400"/>
                    <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search blocks"
                           className="flex-1 text-[12px] outline-none bg-transparent"/>
                  </div>
                </div>
                <LayersTree blocks={blocks} selectedId={selectedId} setSelectedId={setSelectedId}
                            collapsed={collapsed} setCollapsed={setCollapsed} search={search}
                            drag={drag} setDrag={setDrag} onReorder={reorderBlock}/>
              </>
            ) : (
              <InsertGrid onInsert={handleInsert}/>
            )}
          </div>
          <DataPanel dataSources={dataSources} transformers={transformers} blocks={blocks}
                     onOpenSource={openApiAction} onAddSource={() => setApiActionModal({ source: emptyApiAction(), isNew: true })}
                     onOpenTransformer={id => setTransformerModalId(id)} onOpenSample={() => setSampleViewerOpen(true)}/>
        </SidePanel>

        <div className="flex-1 flex flex-col overflow-hidden">
          <div className="flex-1 overflow-auto p-8 flex justify-center items-start" onClick={() => setSelectedId(null)}>
            <div style={{ width: mode === "desktop" ? 420 : 340 }}
                 className="bg-white border border-slate-200 rounded-lg shrink-0"
                 onClick={e => e.stopPropagation()}>
              <CanvasBlock node={blocks} selectedId={selectedId} hoveredId={hoveredId} setHoveredId={setHoveredId}
                           onSelect={setSelectedId} onDuplicate={duplicateBlock} onDelete={deleteBlock} onWrap={wrapBlock}
                           dataItem={null} scope="apiData"/>
            </div>
          </div>
          <Breadcrumb blocks={blocks} selectedId={selectedId}/>
        </div>

        <SidePanel side="right" collapsed={rightCollapsed} onToggle={() => setRightCollapsed(v => !v)} width={320}>
          <PropertiesPanel selectedNode={selectedNode} scope={selectedScope} tab={propsTab} setTab={setPropsTab}
                           tileTheme={tileTheme} setTileTheme={setTileTheme}
                           onCommitBlock={patch => updateBlock(selectedId, patch)}/>
        </SidePanel>
      </div>

      {bottomPanel.open && (
        <BottomPanel tab={bottomPanel.tab} blocks={blocks} mode={mode} onClose={() => setBottomPanel(p => ({ ...p, open: false }))}/>
      )}
      <BottomBar bottomPanel={bottomPanel}
                 onToggle={tab => setBottomPanel(p => (p.open && p.tab === tab ? { open: false, tab } : { open: true, tab }))}/>

      {settingsOpen && (
        <SettingsDrawer tileName={tileName} onNameChange={setTileName}
                         settings={tileSettings} onSettingsChange={patch => setTileSettings(s => Object.assign({}, s, patch))}
                         onClose={() => setSettingsOpen(false)}/>
      )}
      {historyOpen && (
        <HistoryDrawer checkpoints={checkpoints} onClose={() => setHistoryOpen(false)}
                        onPreview={cp => setCheckpointPreview(cp)} onRestore={restoreCheckpoint} onSaveCurrent={saveCheckpointNow}/>
      )}
      {checkpointPreview && <CheckpointPreviewModal checkpoint={checkpointPreview} onClose={() => setCheckpointPreview(null)}/>}
      {apiActionModal && (
        <ApiActionModal source={apiActionModal.source} isNew={apiActionModal.isNew}
                         onSave={saveApiAction} onClose={() => setApiActionModal(null)}/>
      )}
      {transformerModalId && (
        <TransformerModal transformer={transformers.find(t => t.id === transformerModalId)} dataSources={dataSources} blocks={blocks}
                           onSave={code => saveTransformer(transformerModalId, code)} onClose={() => setTransformerModalId(null)}/>
      )}
      {sampleViewerOpen && <SamplePayloadModal onClose={() => setSampleViewerOpen(false)}/>}
      <Toast message={toast}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
